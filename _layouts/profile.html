<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% include seo.html %}
    {% unless page.excerpt %}<meta name="description" content="{{ page.description | default: site.description | escape }}"><meta property="og:description" content="{{ page.description | default: site.description | escape }}">{% endunless %}
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </head>
  <body class="{{ page.page_class }}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Phillip Si, home">Phillip Si</a>
        <nav class="site-nav" aria-label="Main navigation">
          {% for item in site.data.navigation.main %}
          <a href="{{ item.url | relative_url }}"{% if page.url == item.url or item.url == '/publications/' and page.collection == 'publications' %} aria-current="page"{% endif %}>{{ item.title }}</a>
          {% endfor %}
        </nav>
      </div>
    </header>
    <main id="main-content" class="shell" tabindex="-1">
      {{ content }}
    </main>
    <footer class="site-footer">
      <div class="shell footer-inner">
        <p class="colophon">&copy; {{ site.time | date: '%Y' }} Phillip Si</p>
        <div class="footer-links"><a href="mailto:{{ site.author.email }}">Email</a><a href="{{ site.author.googlescholar }}">Google Scholar</a><a href="https://github.com/{{ site.author.github }}">GitHub</a></div>
      </div>
    </footer>
  </body>
</html>
