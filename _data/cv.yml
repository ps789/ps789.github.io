research:
  - institution: Oak Ridge National Laboratory
    role: Graduate Researcher
    dates: May 2026 – Present
    short: Sparse-sensor estimation, latent forecasting, and control for unsteady fluid flow.
    bullets:
      - Developing an AI digital twin for unsteady Navier–Stokes flow that integrates sparse-sensor state and unknown-gust estimation with latent-dynamics forecasting and model predictive control, in collaboration with Guannan Zhang.
      - Built a derivative-supervised neural surrogate and LD-EnSF assimilation–control loop; achieved 27.8× lower wake-fluctuation cost than no control and approximately 0.59 seconds per online update in simulated closed-loop tests (ongoing manuscript).
  - institution: Argonne National Laboratory
    role: Research Aide
    dates: June 2025 – May 2026
    short: Rainfall-driven neural surrogates and digital twins for basin-wide flood prediction.
    bullets:
      - Led development of CLDNet, a rainfall-driven latent neural ODE with terrain-conditioned, coordinate-based decoding for high-resolution flood prediction over the 4.2-million-cell Des Plaines River basin.
      - Enabled 96-hour basin-wide forecasts approximately 115× faster than the numerical solver; validated the flood simulator against USGS measurements and integrated LD-EnSF updates from sparse stream gauges for a flood digital twin.
  - institution: Georgia Institute of Technology
    role: Graduate Researcher
    dates: August 2023 – Present
    short: Generative data assimilation and differentiable latent models for physical systems.
    bullets:
      - Developed Latent-EnSF, combining coupled variational autoencoders and ensemble score filtering for 225× spatially reduced observations; achieved 0.198-second assimilation steps on ERA5, versus 0.501 seconds for full-state EnSF.
      - Helped develop LD-EnSF, combining latent dynamics and history-aware observation encoding; reduced tsunami forecast propagation time by approximately 4,000× versus the full physics solver while retaining accurate sparse-observation filtering.
      - Developed LEVDA, a differentiable latent ensemble-variational smoother for joint state–parameter estimation from sparse, irregular observations, without physical-model adjoints or observation-to-latent encoders.
      - Contributed to LD-EnFF, achieving 5.74%, 6.53%, and 4.42% final-state relative RMSE on Kolmogorov, tsunami, and atmospheric benchmarks, respectively.
      - Contributed to C-STRIDE, reducing flood-depth errors approximately 40% versus gauge-history-only predictions using six gauges and terrain/rainfall inputs.
  - institution: Cornell University
    role: Undergraduate Researcher
    dates: September 2020 – May 2023
    bullets:
      - Studied calibrated predictive uncertainty with Professor Volodymyr Kuleshov, developing probabilistic models for aleatoric and epistemic uncertainty.
      - Developed Autoregressive Quantile Flows, using quantile-based objectives to train expressive conditional distributions without likelihood Jacobian evaluation.
      - Extended generative flow models to semi-autoregressive energy flows trained with sample-based objectives, improving flexible distribution modeling.
  - institution: Cornell Tech
    role: Natural Language Processing Research Intern
    dates: May – August 2019
    bullets:
      - Conducted NLP research with Professor Yoav Artzi at the Language in Context Lab.
      - Developed a system using collaborative interactions to study second-language acquisition in a goal-specified environment with Unity and Python.
      - Used the NewsRoom dataset to generate articles with multiple summary labels for parameter-based summary generation.

